syntax = "proto3";

package darkbio.wire;

// HostToArk represents a message sent from the host to the Ark via the USB
// connection. It embeds all possible message types to keep the protocol simple.
//
// Every message carries an id and is either a request, its id chosen by the
// host, or the host's response to a request of the Ark, echoing the Ark's id.
// To avoid id collisions, hosts allocate odd ids and Arks even ones, so the
// parity of the id alone distinguishes a response from a request.
message HostToArk {
  // Enveloping fields, reserved range 0x001-0x0ff
  uint64 id = 1;           // Request identifier, the host's own or responded to
  optional Error err = 2;  // Error encountered while serving the Ark's request (if any)

  // Body of the message, a request of the host or its response to a request of
  // the Ark. The tags are grouped by area, each area with its own range.
  oneof content {

    // Special factory message

    OnboardingRequest onboard = 0x100; // Installs the signed device attestation at manufacturing

    // System messages, reserved range 0x101-0x200

    DeviceInfoRequest      device_info = 0x101;       // Fetches the hardware and firmware versions
    CloudSyncStartRequest  cloud_sync_start = 0x102;  // Starts a cloud sync with the attested cloud keys
    CloudSyncFinishRequest cloud_sync_finish = 0x103; // Finishes a cloud sync with the signed server time
    GenuinityProofRequest  genuinity_proof = 0x104;   // Requests a proof of the device's genuinity

    // Firmware update messages, reserved range 0x201-0x300

    FirmwareUpdatePrepRequest    firmware_update_prep = 0x201;    // Prepares an update, aborting any in progress
    FirmwareUpdateInitRequest    firmware_update_init = 0x202;    // Initiates a prepared update with the sealed firmware key
    FirmwareUpdateUploadRequest  firmware_update_upload = 0x203;  // Appends a chunk of the firmware archive
    FirmwareUpdateVerifyRequest  firmware_update_verify = 0x204;  // Decrypts and verifies the uploaded firmware
    FirmwareUpdateInstallRequest firmware_update_install = 0x205; // Installs the verified firmware and reboots

    // Pairing messages, reserved range 0x301-0x400

    PairingAuthRequest           pairing_auth = 0x301;            // Asks the Ark to authorize a pairing rendezvous
    PairingSetAppIdentityRequest pairing_set_app_id = 0x302;      // Injects the companion app's identity, relayed by the cloud
    PairingSetAppStorageRequest  pairing_set_app_storage = 0x303; // Injects the companion app's storage key material
    PairingAckArkStorageRequest  pairing_ack_ark_storage = 0x304; // Confirms the app received the Ark's key material
    PairingAcceptanceRequest     pairing_accept = 0x305;          // Waits for the user to accept the pairing
    PairingCompletionRequest     pairing_complete = 0x306;        // Waits for the Ark to finish pairing maintenance

    // Relay messages, reserved range 0x401-0x500

    RelayJoinRequest      relay_join = 0x401;     // Asks the Ark to authorize joining the app relay
    RelayInboundRequest   relay_inbound = 0x402;  // Forwards one frame from the relay socket to the Ark
    RelayOutboundResponse relay_outbound = 0x403; // Confirms the relay socket accepted the frame

    // Operational messages, reserved range 0x501-0x600

    UnlockRequest               unlock = 0x501;           // Requests unlock
    ExecutionCreateRequest      exec_create = 0x502;      // Creates a task
    ExecutionLoadRequest        exec_load = 0x503;        // Loads task modules
    ExecutionStartRequest       exec_start = 0x504;       // Requests approval
    ExecutionStatusRequest      exec_status = 0x505;      // Checks task state
    ExecutionCancelRequest      exec_cancel = 0x506;      // Cancels a task
    ExecutionResultRequest      exec_result = 0x507;      // Reads task result
    ExecutionOutputRequest      exec_output = 0x508;      // Reads task output
    ExecutionModuleSizeResponse exec_module_size = 0x509; // Module size, bytes
    ExecutionModuleReadResponse exec_module_read = 0x50a; // Module bytes

    // Slot messages, reserved range 0x601-0x700

    SlotListRequest          slot_list = 0x601;           // Lists the state of every data slot
    SlotRepairRequest        slot_repair = 0x602;         // Resets a slot to empty whatever its state
    SlotDeleteRequest        slot_delete = 0x603;         // Removes the contents of a filled slot
    SlotIdentifyRequest      slot_identify = 0x604;       // Asks the Ark to identify a file from its first chunk
    SlotUploadStartRequest   slot_upload_start = 0x605;   // Starts uploading a file into a slot
    SlotUploadChunkRequest   slot_upload_chunk = 0x606;   // Appends a chunk to a pending slot upload
    SlotUploadCancelRequest  slot_upload_cancel = 0x607;  // Aborts a pending slot upload
    SlotUploadProcessRequest slot_upload_process = 0x608; // Marks an upload complete and polls its processing

    // Dataset messages, reserved range 0x701-0x800

    DatasetPathsRequest dataset_paths = 0x701; // Maps every path an app can read, from the dataset view

    // Health messages occupy the reserved range 0x901-0xA00.

    // At most 1 MiB of initial import bytes, without a label or file name.
    HealthImportStartRequest health_import_start = 0x901;
    // At most 1 MiB of subsequent import bytes, without an offset or label.
    HealthImportChunkRequest health_import_chunk = 0x902;
    // One upload session to cancel, without import content.
    HealthImportCancelRequest health_import_cancel = 0x903;
    // One upload session to finish or poll, without import content.
    HealthImportProcessRequest health_import_process = 0x904;
    // Empty request for import headers, without permission to read details.
    HealthListRequest health_list = 0x905;
    // One 16-byte import id to delete after a prompt, without resource ids.
    HealthDeleteRequest health_delete = 0x906;
    // One protected-category level to approve, without values or selectors.
    HealthDetailsRequest health_details = 0x907;

    // Unreleased messages served by development firmware only, carried opaquely
    // so the public protocol is untouched while they are still under development.
    // Their schema is private and production Arks refuse the envelope.
    bytes develop = 0x1000;
  }
}

// ArkToHost represents a message sent from the Ark to the host via the USB
// connection. It embeds all possible message types to keep the protocol simple.
//
// Every message carries an id and is either a request, its id chosen by the
// Ark, or the Ark's response to a request of the host, echoing the host's id.
// To avoid id collisions, hosts allocate odd ids and Arks even ones, so the
// parity of the id alone distinguishes a response from a request.
message ArkToHost {
  // Enveloping fields, reserved range 0x001-0x0ff
  uint64 id = 1;           // Request identifier, responded to or the Ark's own
  optional Error err = 2;  // Error encountered while serving the host's request (if any)

  // Body of the message, a response of the Ark to a request of the host or a
  // request of its own. The tags are grouped by area, each area with its own range.
  oneof content {

    // Special factory message

    OnboardingResponse onboard = 0x100; // Acknowledges the onboarding

    // System messages, reserved range 0x101-0x200

    DeviceInfoResponse      device_info = 0x101;       // Hardware and firmware versions of the Ark
    CloudSyncStartResponse  cloud_sync_start = 0x102;  // Challenge for the cloud to sign along its time
    CloudSyncFinishResponse cloud_sync_finish = 0x103; // Timestamp the Ark accepted from the cloud
    GenuinityProofResponse  genuinity_proof = 0x104;   // Encrypted proof of the Ark's genuinity for the cloud

    // Firmware update messages, reserved range 0x201-0x300

    FirmwareUpdatePrepResponse    firmware_update_prep = 0x201;    // Ephemeral key to receive the firmware key with, sealed for the cloud
    FirmwareUpdateInitResponse    firmware_update_init = 0x202;    // Acknowledges the initiated update
    FirmwareUpdateUploadResponse  firmware_update_upload = 0x203;  // Acknowledges the appended firmware chunk
    FirmwareUpdateVerifyResponse  firmware_update_verify = 0x204;  // Acknowledges the verified firmware
    FirmwareUpdateInstallResponse firmware_update_install = 0x205; // Acknowledges the installed firmware

    // Pairing messages, reserved range 0x301-0x400

    PairingAuthResponse             pairing_auth = 0x301;            // Signed authorization for the cloud to open a rendezvous
    PairingSetAppIdentityResponse   pairing_set_app_id = 0x302;      // Acknowledges the accepted app identity
    PairingSetAppStorageResponse    pairing_set_app_storage = 0x303; // Ark device infos and key material, sealed for the app
    PairingAckArkStorageResponse    pairing_ack_ark_storage = 0x304; // Acknowledges the app's receipt of the Ark's keys
    PairingAcceptanceResponse       pairing_accept = 0x305;          // Signed confirmation that the user accepted the pairing
    PairingCompletionResponse       pairing_complete = 0x306;        // Signed confirmation that the Ark finished pairing

    // Relay messages, reserved range 0x401-0x500

    RelayJoinResponse    relay_join = 0x401;     // Signed authorization for the cloud to join the relay
    RelayInboundResponse relay_inbound = 0x402;  // Confirms the Ark opened the frame
    RelayOutboundRequest relay_outbound = 0x403; // Asks the host to write one frame to its relay socket

    // Operational messages, reserved range 0x501-0x600

    UnlockResponse             unlock = 0x501;           // Confirms unlock
    ExecutionCreateResponse    exec_create = 0x502;      // Created task's id
    ExecutionLoadResponse      exec_load = 0x503;        // Confirms task loaded
    ExecutionStartResponse     exec_start = 0x504;       // Task started
    ExecutionStatusResponse    exec_status = 0x505;      // Task state
    ExecutionCancelResponse    exec_cancel = 0x506;      // Task canceled
    ExecutionResultResponse    exec_result = 0x507;      // Released task result
    ExecutionOutputResponse    exec_output = 0x508;      // Next output bytes
    ExecutionModuleSizeRequest exec_module_size = 0x509; // Requests module size
    ExecutionModuleReadRequest exec_module_read = 0x50a; // Reads module bytes

    // Slot messages, reserved range 0x601-0x700

    SlotListResponse          slot_list = 0x601;           // Current state of every data slot
    SlotRepairResponse        slot_repair = 0x602;         // Acknowledges the reset slot
    SlotDeleteResponse        slot_delete = 0x603;         // Acknowledges the deleted slot
    SlotIdentifyResponse      slot_identify = 0x604;       // Identification of the file's first chunk
    SlotUploadStartResponse   slot_upload_start = 0x605;   // Session id of the approved upload
    SlotUploadChunkResponse   slot_upload_chunk = 0x606;   // Acknowledges the appended slot chunk
    SlotUploadCancelResponse  slot_upload_cancel = 0x607;  // Acknowledges the aborted upload
    SlotUploadProcessResponse slot_upload_process = 0x608; // Processing progress of the completed upload

    // Dataset messages, reserved range 0x701-0x800

    DatasetPathsResponse dataset_paths = 0x701; // Every path an app can read, with its description, format and examples

    // Health messages occupy the reserved range 0x901-0xA00.

    // One approved upload handle, without import content.
    HealthImportStartResponse health_import_start = 0x901;
    // Empty acknowledgement, without echoed upload bytes.
    HealthImportChunkResponse health_import_chunk = 0x902;
    // Empty acknowledgement, without import content.
    HealthImportCancelResponse health_import_cancel = 0x903;
    // One upload outcome and counts, without values or free-text failures.
    HealthImportProcessResponse health_import_process = 0x904;
    // Complete header listing within the wire limit, without names or counts.
    HealthListResponse health_list = 0x905;
    // Empty acknowledgement, without deleted content.
    HealthDeleteResponse health_delete = 0x906;
    // Approved metadata within the wire limit, without values or source names.
    HealthDetailsResponse health_details = 0x907;

    // Unreleased messages emitted by development firmware only, in response to
    // a develop request, carried opaquely so the public protocol is untouched
    // while they are still under development. Their schema is private.
    bytes develop = 0x1000;
  }
}

// Error answers a failed request, in place of the response content.
//
// Codes 0x00 through 0xff (inclusive) are reserved for protocol-wide errors.
// Codes 0x100 and above are defined by the request type and may be reused
// with different meanings for different requests. The message text is human
// readable, not a stable code.
message Error {
  uint64 code = 1; // Error code for programmatic interpretation
  string msg = 2;  // Error message for user interfacing
}

// ReservedErrors names the assigned protocol-wide errors in the reserved range
// 0x00 to 0xff (inclusive). No code in this range may be assigned a request
// specific meaning. Assigned codes must not be repurposed.
enum ReservedErrors {
  // A failure without a standardized reason. Zero does not indicate success;
  // the presence of an Error in the response indicates failure.
  RESERVED_ERRORS_UNSPECIFIED = 0;

  // The request's responder was released without providing an application reply.
  RESERVED_ERRORS_UNANSWERED = 1;

  // The peer does not know this request. Emitted by the protocol layer itself
  // when a request's content is not in its schema.
  RESERVED_ERRORS_UNKNOWN = 2;

  // The peer knows this request but never serves it in this build or role,
  // firmware updates on an emulator or develop envelopes on production.
  RESERVED_ERRORS_UNSUPPORTED = 3;

  // The peer serves this request but not in its current state, before cloud
  // sync or pairing. It may once the state changes.
  RESERVED_ERRORS_UNAVAILABLE = 4;

  // The peer serves this request but the phone approval it depends on did not
  // authorize it. The owner declined, or the phone's answer broke the approval's
  // rules and counts as a decline.
  RESERVED_ERRORS_UNAUTHORIZED = 5;

  // The peer serves this request but the approval it depends on did not arrive
  // before its window ran out, on the phone or at the button.
  RESERVED_ERRORS_UNCONFIRMED = 6;

  // The peer serves this request but the approval it depends on could not be
  // sent to the phone, since the relay failed on the way.
  RESERVED_ERRORS_UNDELIVERED = 7;
}


// OnboardingRequest is a vendor utility to onboard an Ark. Currently it contains
// the signed device genuinity attestation (certificate).
//
// Note, as this method is only used during initial device setup, there is no API
// compatibility guarantee, it will evolve with the factory tooling.
message OnboardingRequest {
  bytes device_attestation = 1; // Signed device genuinity attestation (CWT) to install
}
// OnboardingResponse is the acknowledgement of the onboarding.
message OnboardingResponse {
}


// DeviceInfoRequest is sent by the host to fetch the Ark's device stats.
message DeviceInfoRequest {
}
// DeviceInfoResponse returns various hardware and software version information.
message DeviceInfoResponse {
  uint32 version_id = 1;   // Ark device version (defines the major features)
  string version_str = 2;  // Ark device version label (as known by the device)
  uint32 revision_id = 3;  // Ark device revision (defines the minor differences)
  string revision_str = 4; // Ark device revision label (as known by the device)

  reserved 5; // Carried the Ark's hex identity before @darkbio/crypto, derived since
  reserved 6; // Carried the Ark's pubkey before the encrypted wire, in handshake now

  string firmware_version = 7; // Current firmware version (X.Y.Z-commit)
  uint64 firmware_publish = 8; // Current firmware publish unix timestamp

  bool   cloud_synced = 9;  // Whether a cloud identity was accepted since boot
  uint64 cloud_clock = 10;  // Current device clock unix timestamp, set by the cloud sync

  bool paired   = 11; // Whether the Ark is paired with a companion app (user data initialized)
  bool unlocked = 12; // Whether the user data storage is open (false if unpaired)
}


// CloudSyncStartRequest requests the device to start a synchronization procedure
// against the cloud servers to establish the current time as well as the currently
// active cloud identity.
message CloudSyncStartRequest {
  bytes signer = 1; // Post-quantum CWT attestation for the server signing (xDSA) key
  bytes crypto = 2; // Post-quantum CWT attestation for the server encryption (xHPKE) key
}
// CloudSyncStartResponse is an initiation of a cloud sync from the device, authed
// to the requested cloud identity.
message CloudSyncStartResponse {
  bytes challenge = 1; // Random nonce to avoid malicious host machines setting bad times
}

// CloudSyncFinishRequest is the completion of a previously initiated cloud sync
// procedure, this time being signed by a single identity currently used by the
// cloud.
message CloudSyncFinishRequest {
  uint64 unixmilli = 1; // Unix timestamp from the server in milliseconds
  bytes  signature = 2; // SignAt[Cloud]["cloudsync-v1"][unixmilli/1000](CBOR(challenge))
}
// CloudSyncFinishResponse is the acknowledgement whether the device accepted the
// cloud sync from the server or rejected for some reason.
message CloudSyncFinishResponse {
  uint64 accepted = 1; // Timestamp that was accepted and set
}


// GenuinityProofRequest requests the device to generate a cryptographic proof of
// its own authenticity.
message GenuinityProofRequest {
}
// GenuinityProofResponse is the device genuinity proof, an encrypted signature
// of the device.
message GenuinityProofResponse {
  bytes proof = 1; // Seal[Ark->Cloud]["genuinity-v1"][null](null)
}


// FirmwareUpdatePrepRequest prepares a firmware update procedure. If any previous
// update procedure was in progress, it is aborted.
message FirmwareUpdatePrepRequest {
  string version = 1; // Version string to update to
  bytes sha256 = 2;   // SHA256 hash of the (encrypted) firmware archive
  uint64 bytes = 3;   // Number of bytes (progress purposes, ignored otherwise)
}
// FirmwareUpdatePrepResponse confirms that a new firmware update procedure
// started. A rejected request gets an error instead.
//
// The Ark generates a fresh ephemeral encryption key to receive the firmware
// access key. Its public half is sealed to the cloud, bound to the requested
// version and hash.
message FirmwareUpdatePrepResponse {
  bytes auth = 1; // Seal[Ark->Cloud]["firmware-v1"][[version, sha256]](temp-key)
}

// FirmwareUpdateInitRequest initiates a previously prepared firmware update
// procedure by providing the authenticated and encrypted firmware key.
//
// Note, if the initiation is rejected, the entire update process is torn down.
message FirmwareUpdateInitRequest {
  bytes access = 1; // Seal[Cloud->temp-key]["firmware-v1"][[version, sha256]](sym-key)
}
// FirmwareUpdateInitResponse acknowledges the initiated update procedure. A
// rejected request gets an error instead.
//
// Note, if the init is rejected, the entire update process is torn down.
message FirmwareUpdateInitResponse {
}

// FirmwareUpdateUploadRequest requests appending a new chunk of data to the
// currently pending firmware upload process.
message FirmwareUpdateUploadRequest {
  bytes chunk = 1; // Chunk of firmware blob to append (reasonably capped)
}
// FirmwareUpdateUploadResponse is the response whether the requested chunk was
// accepted or rejected.
//
// Note, if the upload is rejected, the entire update process is torn down.
message FirmwareUpdateUploadResponse {
}

// FirmwareUpdateVerifyRequest requests decrypting the uploaded firmware and
// verifying its contents, preparing for the last step of actually installing
// the firmware update.
message FirmwareUpdateVerifyRequest {
}
// FirmwareUpdateVerifyResponse is the response whether the firmware just uploaded
// passed all verifications and is ready for application.
//
// Note, if the verification is rejected, the entire update process is torn down.
message FirmwareUpdateVerifyResponse {
}

// FirmwareUpdateInstallRequest requests the currently pending (but already
// verified) firmware to be applied to disk. This message will cause the device
// to reboot if applied successfully.
message FirmwareUpdateInstallRequest {
}
// FirmwareUpdateInstallResponse is the response whether the firmware was applied
// successfully or not.
message FirmwareUpdateInstallResponse {
}


// PairingAuthRequest requests the initiation of a pairing.
message PairingAuthRequest {
}
// PairingAuthResponse responds whether the device is in a state compatible with
// pairing (i.e. reset) and if so, it signs an authorization for the server to open
// a new rendezvous point; containing the xHPKE public key to use for encrypting
// messages to this Ark after pairing.
message PairingAuthResponse {
  bytes auth = 1;   // Seal[Ark->Cloud]["pairing-v1"][null](pair-key)
  bytes fprint = 2; // Fingerprint of the pair-key to transmit to the app out-of-protocol
}

// PairingSetAppIdentityRequest injects the companion app's identity, relayed
// by the cloud.
message PairingSetAppIdentityRequest {
  bytes identity = 1; // Seal[Cloud->Ark]["pairing-v1:identity"][[ark_signer_id, ark_crypto_id]]([app_signer, app_crypto])
}
// PairingSetAppIdentityResponse confirms whether the remote identity was
// accepted by the Ark or not.
message PairingSetAppIdentityResponse {
}
// PairingSetAppStorageRequest injects the app's storage key material into the
// pairing flow.
message PairingSetAppStorageRequest {
  bytes app_key = 1; // Seal[App->Ark]["pairing-v1:storage"][[ark_signer_id, ark_crypto_id, app_signer_id, app_crypto_id]]([app_keymat])
}
// PairingSetAppStorageResponse confirms whether the remote storage material
// was accepted, and if so, bundles the ark device infos and ark key material.
message PairingSetAppStorageResponse {
  bytes ark_keys = 1; // Seal[Ark->App]["pairing-v1:storage"][[ark_signer_id, ark_crypto_id, app_signer_id, app_crypto_id, app_keymat]]([hw_ver, hw_rev, fw_ver, fw_pub, ark_keymat])
}
// PairingAckArkStorageRequest confirms from the app that the Ark's key material
// was received correctly.
message PairingAckArkStorageRequest{
  bytes app_ack = 1; // Seal[App->Ark]["pairing-v1:storage"][[ark_signer_id, ark_crypto_id, app_signer_id, app_crypto_id, ark_keymat]](null)
}
// PairingAckArkStorageResponse confirms that the key ack was accepted.
message PairingAckArkStorageResponse{
}

// PairingAcceptanceRequest is a blocking poller to wait until the user accepts
// a pairing request or it times out.
message PairingAcceptanceRequest {
}
// PairingAcceptanceResponse returns whether the user accepted the pairing or
// if it timed out. At this point, the device still needs to format itself.
message PairingAcceptanceResponse {
  bytes confirm = 1; //Seal[Ark->Cloud]["pairing-v1:accept"][[ark_signer_id, ark_crypto_id, app_signer_id, app_crypto_id]](null)
}

// PairingCompletionRequest is a blocking poller to wait until the device finishes
// any pairing maintenance operation (e.g. encrypting itself).
message PairingCompletionRequest {
}
// PairingCompletionResponse returns whether the device finished preparing for
// live operation.
message PairingCompletionResponse {
  bytes confirm = 1; // Seal[Ark->Cloud]["pairing-v1:complete"][[ark_signer_id, ark_crypto_id, app_signer_id, app_crypto_id]](null)
}


// RelayJoinRequest requests authorization to join the communication relay with
// the companion app.
message RelayJoinRequest {
}
// RelayJoinResponse responds whether the device is in a state compatible with
// relaying (i.e. paired) and if so, it signs an authorization for the server
// to join the rendezvous point.
message RelayJoinResponse {
  bytes auth = 1; // Seal[Ark->Cloud]["relaying-v2:join"][cloud_crypto_id](null)
}

// RelayInboundRequest forwards one frame from the host's relay socket to the Ark.
//
// The relay connects the Ark with its companion app through the host and the
// cloud. Its frames are opaque to the host, which forwards them unchanged in
// both directions and never interprets them. Each frame is sealed to its
// recipient by the other endpoint, or by the cloud itself, and its
// authenticated data names the recipient's encryption key.
//
// The host sends one request for each message its relay socket delivers, in
// arrival order.
message RelayInboundRequest {
  bytes frame = 1; // Seal[App|Cloud->Ark]["relaying-v2:frame"][ark_crypto_id](...)
}
// RelayInboundResponse confirms the Ark opened the frame, which decrypted and
// verified. The Ark answers before acting on the frame's content, and refuses
// a frame it cannot open with an error whose message names the cause.
message RelayInboundResponse {
}

// RelayOutboundRequest asks the host to write one frame to its relay socket.
//
// A host without a relay socket attaches one first through relay_join. If it
// cannot, it answers with the reserved UNAVAILABLE error.
message RelayOutboundRequest {
  bytes frame = 1; // Seal[Ark->App]["relaying-v2:frame"][app_crypto_id](...)
}
// RelayOutboundResponse confirms that the relay socket accepted the frame, which
// does not mean the frame reached the app.
message RelayOutboundResponse {
}


// UnlockRequest asks the Ark to open its user data storage.
//
// The Ark answers once the owner approves or declines on their phone, or the
// approval window runs out.
message UnlockRequest{
}
// UnlockResponse acknowledges the completed unlock. Any other outcome gets an
// error instead.
message UnlockResponse{
}

// ExecutionCreateRequest creates a task, naming its main app's module by its
// 32-byte SHA-256 digest. The Ark answers at once with a new task id, or
// refuses when it has no free task slot.
//
// The task belongs to the session that created it. Ending that session drops
// the task at any stage, canceling apps that still run. A task that waits 5s
// between steps without the host's next request expires.
message ExecutionCreateRequest{
  bytes sha256 = 1; // Main module's SHA-256 digest, exactly 32 bytes
}
// ExecutionCreateResponse contains the new task's id, which every later
// message about it carries.
message ExecutionCreateResponse{
  uint64 taskid = 1; // Task id to load and start
}

// ExecutionLoadRequest fetches and checks every module of the task and runs
// their manifest passes. It fetches the main module first, then dependencies,
// depth first in manifest order, each distinct module once. The Ark asks the
// host through exec_module_size and exec_module_read, one request per task
// in flight. A request left unanswered for 30s fails the task.
//
// Loading has no overall deadline. The host waits for the Ark's answer or
// cancels the task. A task already loaded or started fails this request.
message ExecutionLoadRequest{
  uint64 taskid = 1; // Task id returned by ExecutionCreateResponse
}
// ExecutionLoadResponse acknowledges that the task is loaded. A refusal gets
// an error instead.
message ExecutionLoadResponse{
}

// ExecutionStartRequest reserves room for the task's approval records and
// opens the approval on the owner's phone. It fails unless the task is loaded.
//
// The Ark answers once the owner approves. A decline gets the reserved
// UNAUTHORIZED error, an expired approval UNCONFIRMED, and an approval that
// could not be sent to the phone UNDELIVERED.
message ExecutionStartRequest{
  uint64 taskid = 1; // Task id returned by ExecutionCreateResponse
}
// ExecutionStartResponse acknowledges the owner's approval, after which the
// task's apps run.
message ExecutionStartResponse{
}

// ExecutionCancelRequest cancels a task at any stage before its apps end,
// including loading and awaiting the owner's approval. Canceling a task whose
// apps run fails it, and its report then goes to the owner's review like any
// other. A task whose apps already ended cannot be canceled.
message ExecutionCancelRequest{
  uint64 taskid = 1; // Task id to cancel
}
// ExecutionCancelResponse acknowledges the canceled task.
message ExecutionCancelResponse{
}

// ExecutionStatusRequest checks where a task stands after approval. Only the
// session that created the task can check it.
message ExecutionStatusRequest{
  uint64 taskid = 1; // Task id to check
}
// ExecutionState is where an approved task stands for its host.
enum ExecutionState {
  EXECUTION_STATE_UNSPECIFIED = 0; // Never sent, an unset state
  EXECUTION_STATE_RUNNING     = 1; // The task's apps still run
  EXECUTION_STATE_AWAITING    = 2; // Apps ended, owner reviews the report
  EXECUTION_STATE_RESOLVED    = 3; // The review closed, so exec_result answers
}
// ExecutionStatusResponse reports where an approved task stands.
message ExecutionStatusResponse{
  reserved 1; // Kept free, since older hosts read it as their pending flag
  reserved 2; // Kept free, since older hosts read it as their result

  ExecutionState state = 3; // Where the task stands
}

// ExecutionResultRequest fetches the result of a resolved task for the session
// that created it.
//
// A released task answers with what the owner saw, the same until the task
// closes for the host. A withheld task fails it with the reserved error its
// report's approval closed with, and that failure closes the task.
message ExecutionResultRequest{
  uint64 taskid = 1; // Task id to fetch the result of
}
// ExecutionResultResponse holds what the owner saw when releasing the task's
// output, which the host then reads through ExecutionOutputRequest.
message ExecutionResultResponse{
  string          name         = 1; // App name from its manifest
  string          version      = 2; // App version from its manifest
  bool            develop      = 3; // Whether the app is a develop build
  bool            success      = 4; // Whether the task succeeded
  repeated string paths        = 5; // Paths of the owner's data as mounted, without public grants
  string          media        = 6; // Report media type, always text/markdown
  uint64          stdout_bytes = 7; // Length in bytes of the report, the app's standard output
  uint64          stderr_bytes = 8; // Length in bytes of a develop build's standard error, 0 otherwise
}

// ExecutionStream names one of the app's output streams.
enum ExecutionStream {
  EXECUTION_STREAM_UNSPECIFIED = 0; // Never sent, an unset stream
  EXECUTION_STREAM_STDOUT      = 1; // Standard output, the report
  EXECUTION_STREAM_STDERR      = 2; // Standard error, kept for develop builds only
}
// ExecutionOutputRequest reads the next piece of a released task's output for
// the session that created it.
//
// Each stream is read once and in order, in pieces of the size the host asks
// for. The Ark refuses a size of zero, or one whose answer would not fit a
// wire message. The task closes for the host once exec_result has answered
// and both streams are read to their end.
message ExecutionOutputRequest{
  uint64          taskid = 1; // Task id to read the output of
  ExecutionStream stream = 2; // Stream to read
  uint64          offset = 3; // Bytes of the stream read so far, the only offset the Ark accepts
  uint64          size   = 4; // Most bytes to return, chosen by the host
}
// ExecutionOutputResponse carries the next piece of the requested stream.
message ExecutionOutputResponse{
  bytes chunk = 1; // The requested bytes, fewer only at the stream's end
}

// ExecutionModuleSizeRequest asks the host for the size of a module of the
// task, named by its 32-byte SHA-256 digest. The Ark keeps one module request
// in flight per task. Each request gets 30s; an unanswered one fails the task.
message ExecutionModuleSizeRequest{
  uint64 taskid = 1; // Task id whose module the Ark needs
  bytes sha256 = 2;  // Module's SHA-256 digest, exactly 32 bytes
}
// ExecutionModuleSizeResponse returns the module's size in bytes. A host that
// cannot serve the module answers with an error, and the Ark refuses the task.
message ExecutionModuleSizeResponse{
  uint64 size = 1; // Size of the module in bytes
}

// ExecutionModuleReadRequest asks the host for a module's bytes from offset,
// at most size of them. The request never passes the module's end and asks for
// at most 1 MiB. The Ark keeps one module request in flight per task. Each
// request gets 30s; an unanswered one fails the task.
message ExecutionModuleReadRequest{
  uint64 taskid = 1; // Task id whose module the Ark needs
  bytes sha256 = 2;  // Module's SHA-256 digest, exactly 32 bytes
  uint64 offset = 3; // Byte offset within the module
  uint64 size = 4;   // Most bytes to return, at most 1 MiB
}
// ExecutionModuleReadResponse carries at least one byte and at most the size
// requested. The Ark continues where the answer ended. An empty or longer
// answer fails the task.
//
// Hosts answer once they hold the size asked for, or about once a second with
// what they hold, whichever comes first.
message ExecutionModuleReadResponse{
  bytes chunk = 1; // Bytes of the module from the requested offset
}


// SlotKind identifies a slot on the device. Each value corresponds to a unique
// data type that the device can store and manage.
enum SlotKind {
  SLOT_KIND_UNSPECIFIED          = 0; // Never sent, an unset kind
  SLOT_KIND_REFERENCE_GENOME     = 1; // Human reference genome assembly
  SLOT_KIND_GENE_ANNOTATIONS     = 2; // Gene-to-coordinate mapping database
  SLOT_KIND_SMALL_VARIANTS       = 3; // User's small variant calls, SNVs and indels
  SLOT_KIND_VARIANT_CATALOG      = 4; // Variant catalog (rsID-to-position), from dbSNP
  SLOT_KIND_STRUCTURAL_VARIANTS  = 5; // User's structural variant calls
  SLOT_KIND_COPY_NUMBER_VARIANTS = 6; // User's copy number calls
}

// SlotOrigin describes the nature of the data in a slot, determining what
// actions are available to the user for filling it.
enum SlotOrigin {
  SLOT_ORIGIN_UNSPECIFIED = 0; // Never sent, an unset origin
  SLOT_ORIGIN_PERSONAL    = 1; // Unique to the user, uploaded by them
  SLOT_ORIGIN_REFERENCE   = 2; // Standard reference data, downloaded from public sources
}

// SlotState describes whether a slot holds data and whether that data is sound.
enum SlotState {
  SLOT_STATE_UNSPECIFIED = 0; // Never sent, an unset state
  SLOT_STATE_EMPTY       = 1; // Nothing stored
  SLOT_STATE_FILLED      = 2; // Data present and healthy
  SLOT_STATE_DAMAGED     = 3; // Files exist but the metadata is missing, corrupt or outdated
}

// SlotConfidence indicates how confident the device is in its identification
// of a file, based on content, filename and size.
enum SlotConfidence {
  SLOT_CONFIDENCE_UNSPECIFIED = 0; // Never sent, an unset confidence
  SLOT_CONFIDENCE_LOW         = 1; // Filename/extension only, no content confirmation
  SLOT_CONFIDENCE_MID         = 2; // Format detected but slot type inferred from size/filename
  SLOT_CONFIDENCE_HIGH        = 3; // Magic bytes match and format-specific content confirmed
}

// SlotDownload describes the public download the device advertises for a
// reference slot, so a host can fetch it and stream it back in.
message SlotDownload {
  string url    = 1; // Public download URL
  uint64 bytes  = 2; // Download size in bytes
  string sha256 = 3; // Download SHA256 checksum
}

// SlotStatus describes the current state of a single slot on the device. The
// data fields are generic so a host renders a kind it has never seen.
message SlotStatus {
  SlotKind   kind   = 1; // Slot type
  string     name   = 2; // Human-readable slot name
  string     desc   = 3; // Owner-facing description of the data this slot holds
  string     format = 4; // The file that fills this slot, its required shape and what is refused
  SlotOrigin origin = 5; // Nature of the data (personal, reference)
  SlotState  state  = 6; // Whether the slot is empty, filled or damaged
  string     damage = 7; // Why the slot is damaged, empty otherwise
  repeated SlotKind deps = 8; // Slots that must be filled before this one is actionable
  uint64     bytes  = 9; // Bytes on disk for this slot (0 if empty)

  string       build    = 10; // Reference assembly the data is keyed to (e.g. "GRCh38.p14")
  string       version  = 11; // The dataset's own release, if it has one (e.g. dbSNP "157")
  SlotDownload download = 12; // Advertised public download, absent if none
}

// SlotListRequest requests the state of all slots on the device.
message SlotListRequest {
}
// SlotListResponse contains the current state of every slot.
message SlotListResponse {
  repeated SlotStatus slots = 1; // State of every slot, one entry per slot kind
}

// SlotRepairRequest resets a slot to empty regardless of its current state.
// Unlike SlotDelete (which requires the slot to be filled), repair is a stateless
// force cleanup that removes any leftover metadata and/or files on disk. It is
// intended for recovering from corruption or half-written state after crashes.
message SlotRepairRequest {
  SlotKind slot = 1; // Slot to repair (reset to empty)
}
// SlotRepairResponse is an empty ack of the repair request.
message SlotRepairResponse {
}

// SlotDeleteRequest removes the contents of a filled slot. The slot must be
// in a healthy, filled state; corrupted or half-written slots must be cleaned
// up via SlotRepair instead.
message SlotDeleteRequest {
  SlotKind slot = 1; // Slot to delete
}
// SlotDeleteResponse is an empty ack of the delete request.
message SlotDeleteResponse {
}

// SlotIdentifyRequest sends an ephemeral file chunk to the Ark and asks it to
// identify the file. Its purpose is to filter potentially huge files (e.g. a
// 30GB compressed whole genome sequencing) before uploading them, and to
// answer what a file is without uploading it at all.
message SlotIdentifyRequest {
  string name = 1; // File name to guess the contents of
  uint64 size = 2; // File size to guess the contents of
  bytes chunk = 3; // First chunk of the file to guess the contents of

  repeated SlotKind kinds = 4; // Possible slots to interpret as (empty == any)
}
// SlotIdentifyResponse contains the identification based on the chunk shared
// in the request.
message SlotIdentifyResponse {
  SlotKind kind = 1;       // Identified slot type to use during upload
  SlotConfidence conf = 2; // Identification confidence level

  string summary = 3;   // Short summary of the identified data
  string details = 4;   // Detailed description of the identified data
  string rejection = 5; // Reason why the file is rejected, empty otherwise
}

// SlotUploadStartRequest requests uploading a file into a slot of the given
// kind (e.g. a whole genome variant call file).
message SlotUploadStartRequest {
  SlotKind kind = 1; // Slot type requesting to upload

  string name = 2; // File name to guess the contents of
  uint64 size = 3; // File size to guess the contents of
  bytes chunk = 4; // First chunk of the file to guess the contents of
}
// SlotUploadStartResponse contains a unique session id for an approved upload.
message SlotUploadStartResponse {
  uint64 session = 1; // Session id for concurrent uploads (not recommended)
}
// SlotUploadChunkRequest contains a new chunk of data to append to a pending
// upload session.
message SlotUploadChunkRequest {
  uint64 session = 1; // Session id into which to append a new chunk
  bytes chunk = 2;    // Data chunk to append (reasonably capped)
}
// SlotUploadChunkResponse is an empty ack of the chunk upload request.
message SlotUploadChunkResponse {
}
// SlotUploadCancelRequest contains an upload session id to abort.
message SlotUploadCancelRequest {
  uint64 session = 1; // Session id to cancel
}
// SlotUploadCancelResponse is an empty ack of the cancellation request.
message SlotUploadCancelResponse {
}

// SlotPhase names one step of a slot's processing pipeline.
message SlotPhase {
  string name = 1; // Short label for the phase
  string desc = 2; // Description of what the phase does
}

// SlotUploadProcessRequest marks an upload session ready for processing and
// requests a progress report to be sent back. May be called multiple times.
message SlotUploadProcessRequest {
  uint64 session = 1; // Session id to mark as completed
}
// SlotUploadProcessResponse acks the completion of a slot upload and also
// contains the current processing progress.
message SlotUploadProcessResponse {
  uint64 proc_start = 1; // Unix timestamp when data processing started

  repeated SlotPhase phases = 2; // Every phase of the pipeline, in order

  uint64 phase_in = 3;       // Current phase (1-indexed)
  uint64 phase_start = 4;    // Unix timestamp when the current phase started
  uint64 phase_progress = 5; // Approximate progress for this phase [0-10000]

  string failure = 6; // Failure reason if processing failed, empty otherwise
}


// DatasetPathsRequest requests the map of every path an app can read, the
// dataset view the device derives from its slots, lenses included.
message DatasetPathsRequest {
}
// DatasetPathsResponse maps every path an app can read, available or not, in
// tree order. It describes the tree only and never carries a value from the
// owner's data.
message DatasetPathsResponse {
  repeated DatasetPath paths = 1; // Every path pattern, in tree order
}

// DatasetPath describes one path pattern under the data root. A segment in angle
// brackets is a placeholder, described by the directory entry it names. The path
// is the entry's stable key.
//
// A grantable path also carries its wording and whether it is public. A public
// path reads nothing about the owner's DNA, such as the reference genome or
// which datasets are uploaded. The wording is an English template that
// describes a grant to the owner, with each placeholder named after the path's
// own, such as "Your genome around variant {rsid}".
message DatasetPath {
  string          path      = 1; // Path as a manifest names it
  bool            directory = 2; // Directory or file
  bool            grantable = 3; // Whether a manifest may name it
  bool            available = 4; // Whether the data this path needs is on the Ark now
  string          desc      = 5; // What it holds, when it is absent and when it fails
  string          format    = 6; // Exact file content, or what a directory lists
  repeated string examples  = 7; // Complete example values, most typical first
  bool            public    = 8; // Whether a grant reads nothing about the owner's DNA, for grantable paths
  string          wording   = 9; // Template wording a grant to the owner, for grantable paths
}


// Request failures carried in ArkToHost.err.
// Error.msg uses fixed wording. Input excerpts, values, names, resource ids,
// paths and internal diagnostics are excluded. Prompt declines, expiries and
// delivery failures use ReservedErrors UNAUTHORIZED, UNCONFIRMED and
// UNDELIVERED, respectively.
enum HealthErrors {
  // Unset code, invalid as a health error.
  HEALTH_ERRORS_UNSPECIFIED = 0;
  // Invalid size, chunk or id.
  HEALTH_ERRORS_REQUEST_INVALID = 0x901;
  // Locked owner storage.
  HEALTH_ERRORS_STORAGE_LOCKED = 0x902;
  // Occupied import or prompt capacity.
  HEALTH_ERRORS_BUSY = 0x903;
  // Absent, expired or foreign upload session.
  HEALTH_ERRORS_SESSION_UNKNOWN = 0x904;
  // Wrong upload state for this request.
  HEALTH_ERRORS_SESSION_STATE = 0x905;
  // Received bytes below the declared size.
  HEALTH_ERRORS_UPLOAD_INCOMPLETE = 0x906;
  // Absent committed import.
  HEALTH_ERRORS_IMPORT_UNKNOWN = 0x907;
  // Failed storage operation.
  HEALTH_ERRORS_STORAGE_FAILED = 0x908;
  // Exceeded size, resource count or response limit.
  HEALTH_ERRORS_LIMIT = 0x909;
}

// Prompt request for one FHIR R4 JSON or NDJSON stream.
// The Ark checks size limits before the 60s phone prompt and writes no upload
// bytes until approval. A refusal returns ArkToHost.err.
// TODO(fhir-import-2): limits are 256 MiB per import, 64 MiB per resource or
// NDJSON line and 2 million resources, including packaging and invalid entries.
// Applications enforce these semantic limits; protobuf decoding does not.
message HealthImportStartRequest {
  reserved 1;
  reserved "label";
  // Total received size, 1 byte through 256 MiB including chunk.
  uint64 size = 2;
  // First received bytes, 1 byte through 1 MiB and no larger than size.
  bytes chunk = 3;
}

// Approved upload handle with the first chunk accepted.
// The upload belongs to the current host wire session and expires after 30s
// idle or when that wire session ends. Committed imports remain stored.
message HealthImportStartResponse {
  // Nonzero upload handle scoped to this host session.
  uint64 session = 1;
}

// Next upload bytes, at most 1 MiB.
// The host waits for each acknowledgement before sending another chunk.
// An uncertain acknowledgement cannot be retried; a rejected chunk adds nothing.
// The Ark refuses bytes beyond the size declared in HealthImportStartRequest.
message HealthImportChunkRequest {
  // Nonzero handle from HealthImportStartResponse.
  uint64 session = 1;
  // Next received bytes, 1 byte through 1 MiB.
  bytes chunk = 2;
}

// Empty acknowledgement extending the upload's 30s idle window.
// Processing reports any later write failure before committing the import.
message HealthImportChunkResponse {
}

// Cancellation of one upload or processing session.
// The response waits until processing cannot commit. An already committed
// import requires HealthDeleteRequest. Canceling an absent session succeeds.
message HealthImportCancelRequest {
  // Nonzero upload handle in this host session.
  uint64 session = 1;
}

// Empty acknowledgement that temporary upload state is gone.
message HealthImportCancelResponse {
}

// Processing state of one upload.
enum HealthImportState {
  // Unset state, invalid in a processing response.
  HEALTH_IMPORT_STATE_UNSPECIFIED = 0;
  // Import processing in progress.
  HEALTH_IMPORT_STATE_PROCESSING = 1;
  // Committed import with its summary.
  HEALTH_IMPORT_STATE_DONE = 2;
  // Failed import with no commit.
  HEALTH_IMPORT_STATE_FAILED = 3;
}

// Work in progress while an import is processing.
enum HealthImportPhase {
  // No active phase, required in DONE and FAILED.
  HEALTH_IMPORT_PHASE_UNSPECIFIED = 0;
  // Writing the import file.
  HEALTH_IMPORT_PHASE_STORING = 1;
  // Building the import's index.
  HEALTH_IMPORT_PHASE_INDEXING = 2;
}

// Terminal import failure reported by a fixed code.
// Input excerpts, values, names, resource ids and internal diagnostics are
// excluded, as with HealthErrors.
enum HealthImportFailure {
  // No failure, required in PROCESSING and DONE and forbidden in FAILED.
  HEALTH_IMPORT_FAILURE_UNSPECIFIED = 0;
  // Input is not a supported FHIR R4 JSON or NDJSON stream.
  HEALTH_IMPORT_FAILURE_NOT_FHIR = 1;
  // More than one distinct patient.
  HEALTH_IMPORT_FAILURE_SEVERAL_PATIENTS = 2;
  // Identical received bytes are already imported.
  HEALTH_IMPORT_FAILURE_ALREADY_IMPORTED = 3;
  // Import, resource or count limit exceeded.
  HEALTH_IMPORT_FAILURE_LIMIT = 4;
  // Import or index could not be stored.
  HEALTH_IMPORT_FAILURE_STORAGE_FAILED = 5;
}

// Completion or poll of one upload session.
// The first call starts processing only when received bytes equal declared size.
// An incomplete upload returns HEALTH_ERRORS_UPLOAD_INCOMPLETE and accepts chunks.
// Later calls only poll. Terminal results remain available for 60s, unless the
// upload is canceled or its host wire session ends first.
message HealthImportProcessRequest {
  // Nonzero upload handle to finish or poll.
  uint64 session = 1;
}

// One upload's progress and outcome.
// Request failures use ArkToHost.err; processing failures use FAILED and failure.
// TODO(fhir-import-2): progress is an overall estimate across both phases.
message HealthImportProcessResponse {
  // Current state, required to be set.
  HealthImportState state = 1;
  // STORING or INDEXING in PROCESSING; UNSPECIFIED in DONE and FAILED.
  HealthImportPhase phase = 2;
  // Approximate overall progress in basis points, 0 through 10000.
  // DONE carries 10000; FAILED keeps the last estimate.
  uint64 progress = 3;
  // Nonzero failure code exactly in FAILED.
  HealthImportFailure failure = 4;
  // One committed import's counts, present exactly in DONE.
  HealthImportSummary summary = 5;
}

// Detected shape of a FHIR stream.
enum HealthFileKind {
  // Unset kind, invalid for a committed import.
  HEALTH_FILE_KIND_UNSPECIFIED = 0;
  // One Bundle of any type.
  HEALTH_FILE_KIND_BUNDLE = 1;
  // Newline-delimited resources.
  HEALTH_FILE_KIND_NDJSON = 2;
  // One resource outside a Bundle.
  HEALTH_FILE_KIND_SINGLE_RESOURCE = 3;
}

// Resource counts by class.
// Each resource counts once in exactly one class, including invalid entries.
// Each count and their sum are at most 2 million; codings do not add resources.
message HealthClassCounts {
  // Clinical resources, 0 through 2 million.
  uint64 clinical = 1;
  // Measurement resources, 0 through 2 million.
  uint64 measurement = 2;
  // Signal resources, 0 through 2 million.
  uint64 signal = 3;
  // Attachment resources, 0 through 2 million.
  uint64 attachment = 4;
  // Other resources including unplaced entries, 0 through 2 million.
  uint64 other = 5;
  // Packaging resources including OperationOutcome, 0 through 2 million.
  uint64 packaging = 6;
  // Invalid entries, 0 through 2 million.
  uint64 invalid = 7;
}

// Bounds of known clinical times in Unix milliseconds.
// Absent as a whole when no time is known. Partial dates contribute their start
// in UTC; times without an offset use UTC. A single time fills both fields.
// TODO(fhir-import-2): these conventions do not retain input date precision.
message HealthTimeSpan {
  // Earliest time as signed Unix milliseconds, at most last.
  int64 first = 1;
  // Latest time as signed Unix milliseconds, at least first.
  int64 last = 2;
}

// Summary of the uploaded bytes.
// Full counts include protected entries because this host supplied the input.
// Counts describe this import, without deduplication against other imports.
// Values, free text, names and resource ids are excluded.
message HealthImportSummary {
  // Exactly 16 random bytes assigned by the Ark to the import.
  bytes import_id = 1;
  // Upload's received time in Unix milliseconds.
  int64 received = 2;
  // Detected file shape, required to be set.
  HealthFileKind file_kind = 3;
  // All resources by class, always present.
  HealthClassCounts counts = 4;
  // Protected resources counted once, 0 through 2 million.
  uint64 protected_entries = 5;
  // Unplaced resources also counted in counts.other, 0 through counts.other.
  uint64 unplaced = 6;
  // OperationOutcome resources, 0 through counts.packaging.
  uint64 export_errors = 7;
  // Full import's known clinical times, absent if unknown.
  HealthTimeSpan time_span = 8;
}

// Empty request for committed import headers.
// Requires unlocked storage but no prompt. Pending and failed imports are absent.
// TODO(fhir-import-2): lists have no pagination. A complete reply that exceeds
// the wire message limit returns HEALTH_ERRORS_LIMIT without partial content.
message HealthListRequest {
}

// Complete import header listing within the wire limit.
message HealthListResponse {
  // Headers sorted by received time, then raw id bytes.
  // Empty when no imports exist; hosts number this list starting at 1.
  repeated HealthImportInfo imports = 1;
}

// One committed import's id, received time and detected file shape.
// Reading it requires neither an index nor permission to read details.
message HealthImportInfo {
  // Exactly 16 random bytes assigned by the Ark to the import.
  bytes import_id = 1;
  // Upload's received time in Unix milliseconds.
  int64 received = 2;
  // Detected shape, required to be set.
  HealthFileKind file_kind = 3;
}

// Prompt request for metadata about all imports.
// Approval opens a window for this host wire session and this exact level.
// Calls at that level reuse the unexpired window without a prompt or extension.
// A different level requires its own decision and replaces the active window
// only on approval. Disconnect, lock or expiry closes access. The phone prompt
// allows 120s for a decision; the access window starts after approval.
// TODO(fhir-import-2): the host selects the level and the phone confirms it.
message HealthDetailsRequest {
  // Whether protected kinds may appear in the approved details.
  bool include_protected = 1;
}

// Complete approved metadata for each import and the kinds across all imports.
// An oversized complete reply returns HEALTH_ERRORS_LIMIT.
// Applications enforce these content rules; generated codecs do not validate
// string meanings, id lengths, enum membership or cross-field constraints.
message HealthDetailsResponse {
  // Remaining access time in seconds, rounded down, independent of prompt time.
  // Zero means the host must hide details; calls leave the deadline unchanged.
  uint32 remaining_seconds = 1;
  // Approved level matching the request.
  bool include_protected = 2;
  // All imports sorted as HealthListResponse, within the wire message limit.
  // Empty if none exist.
  repeated HealthImportDetails imports = 3;
  // Kinds visible at this level across all imports, sorted by category, system,
  // code and protected-category set, as each import's kinds are.
  repeated HealthKindOverview kinds = 4;
  // Distinct protected resource identities across all imports, at either level.
  // Multiple codings or protected categories count once; no dates are exposed.
  uint64 protected_entries = 5;
  // Distinct attachment, other and invalid identities visible at this level
  // across all imports. Unplaced entries are already included in other.
  // Hidden protected entries and packaging are excluded.
  uint64 unsupported_entries = 6;
  // Known times of those distinct unsupported entries, absent if unknown.
  // Each identity uses its newest visible unsupported copy, by export time
  // else received time, and its last occurrence within that import.
  HealthTimeSpan unsupported_time_span = 7;
}

// Content-derived import name chosen by the Ark from unprotected kinds.
// The first matching rule wins: single kind, all lab results, hospital stay,
// then health record. The name is independent of the approved details level.
enum HealthImportName {
  // Unset name, invalid in approved details.
  HEALTH_IMPORT_NAME_UNSPECIFIED = 0;
  // Health record, including an import with no unprotected kinds.
  HEALTH_IMPORT_NAME_HEALTH_RECORD = 1;
  // Every unprotected kind is a lab result, with at least two kinds.
  HEALTH_IMPORT_NAME_LAB_RESULTS = 2;
  // A hospital stay among the import's unprotected visits.
  HEALTH_IMPORT_NAME_HOSPITAL_STAY = 3;
  // Exactly one unprotected kind; the host uses that kind's name.
  HEALTH_IMPORT_NAME_SINGLE_KIND = 4;
}

// Approved metadata for one import.
// Kinds omit protected entries unless include_protected was approved. At the
// lower level only protected_entries counts them; their times and unsupported
// classes are excluded. Received time and both sizes describe the whole import.
// Values, free text, source names and resource ids are excluded.
message HealthImportDetails {
  // Exactly 16 random bytes assigned by the Ark to the import.
  bytes import_id = 1;
  // Content-derived name, required to be set.
  HealthImportName name = 2;
  // Upload's received time in Unix milliseconds.
  int64 received = 3;
  // Received stream size, 1 byte through 256 MiB.
  uint64 received_size = 4;
  // Total bytes in the import and index files, excluding cached views.
  // Nonzero for a committed import.
  uint64 stored_size = 5;
  // Known times of entries visible at this level, absent when none are known.
  HealthTimeSpan time_span = 6;
  // Kinds grouped by category, system, code and protected-category set.
  // Sorted in that order within the wire limit.
  repeated HealthKind kinds = 7;
  // Protected resources counted once, 0 through 2 million, at either level.
  // A resource in several protected categories counts once.
  uint64 protected_entries = 8;
  // Unsupported counts visible at this level, always present.
  HealthUnsupportedCounts unsupported = 9;
}

// Category of a visible kind of data.
enum HealthCategory {
  // Unset category, invalid for a kind.
  HEALTH_CATEGORY_UNSPECIFIED = 0;
  // Clinical records.
  HEALTH_CATEGORY_CLINICAL = 1;
  // Measurements.
  HEALTH_CATEGORY_MEASUREMENT = 2;
  // Signal recordings.
  HEALTH_CATEGORY_SIGNAL = 3;
}

// Part of the health record assigned by the Ark from resource types and the
// classification of clinical Observations. Hosts group further by code.
enum HealthArea {
  // Measurements and signals, whose groups come from their codes.
  HEALTH_AREA_UNSPECIFIED = 0;
  // Clinical Observations classified as lab results.
  HEALTH_AREA_LAB_RESULTS = 1;
  // Other clinical Observations, such as surveys and scores.
  HEALTH_AREA_OTHER_OBSERVATIONS = 2;
  // Conditions.
  HEALTH_AREA_CONDITIONS = 3;
  // Medications and their prescriptions, statements, dispensing or administration.
  HEALTH_AREA_MEDICATIONS = 4;
  // Immunizations.
  HEALTH_AREA_VACCINES = 5;
  // Allergies and intolerances.
  HEALTH_AREA_ALLERGIES = 6;
  // Procedures.
  HEALTH_AREA_PROCEDURES = 7;
  // Encounters, including hospital stays.
  HEALTH_AREA_VISITS = 8;
  // Diagnostic reports.
  HEALTH_AREA_REPORTS = 9;
  // Imaging studies.
  HEALTH_AREA_IMAGING = 10;
  // Family member history.
  HEALTH_AREA_FAMILY_HISTORY = 11;
}

// Protected category assigned to a resource by the Ark.
enum HealthProtectedCategory {
  // Unset category, invalid in a kind's protected categories.
  HEALTH_PROTECTED_CATEGORY_UNSPECIFIED = 0;
  // HIV-related entries.
  HEALTH_PROTECTED_CATEGORY_HIV = 1;
  // Sexual and reproductive health.
  HEALTH_PROTECTED_CATEGORY_SEXUAL_REPRODUCTIVE = 2;
  // Mental health.
  HEALTH_PROTECTED_CATEGORY_MENTAL_HEALTH = 3;
  // Substance use.
  HEALTH_PROTECTED_CATEGORY_SUBSTANCE_USE = 4;
  // Genetic tests.
  HEALTH_PROTECTED_CATEGORY_GENETIC_TESTS = 5;
}

// One kind's resource counts within an import.
// A resource with several codings can count under several kinds. Counts within
// a kind count distinct resource identities. The key is category, system, code
// and the protected-category set, shared with HealthKindOverview.
// Values, free text, source names and resource ids are excluded. Kind names use
// Ark terminology or a code-based fallback; input text and display are excluded.
message HealthKind {
  // Clinical, measurement or signal, required to be set.
  HealthCategory category = 1;
  // Part of the record, set for clinical kinds; UNSPECIFIED for other categories.
  HealthArea area = 2;
  // Code-system identifier, at most 256 UTF-8 bytes, with controls excluded.
  // Empty only with an empty code.
  string system = 3;
  // Kind's code, at most 128 UTF-8 bytes, with controls and outer space excluded.
  // Empty with system for uncoded kinds.
  string code = 4;
  // Kind name, 1 through 80 characters on one line.
  // TODO(fhir-import-2): wire names use the Ark's corpus-derived terminology.
  string name = 5;
  // Distinct resource count in this import, 1 through 2 million.
  uint64 count = 6;
  // Known times of these resources, absent if unknown.
  HealthTimeSpan time_span = 7;
  // Sorted distinct protected categories, at most five.
  // Empty for unprotected entries. Nonempty only at the approved higher level.
  repeated HealthProtectedCategory protected_categories = 8;
  // Distinct resource identities absent from every other import, 0 through
  // count. These entries disappear on deletion.
  uint64 unique_entries = 9;
}

// One visible kind across all imports, joined to HealthKind by category,
// system, code and protected-category set. The key, area and name follow
// HealthKind's content rules and limits. Protected kinds appear only when
// include_protected is approved. Each resource identity counts once per kind
// across all imports; adding per-import counts would count shared entries again.
message HealthKindOverview {
  // Clinical, measurement or signal, required to be set.
  HealthCategory category = 1;
  // Part of the record, matching this key's per-import kinds.
  HealthArea area = 2;
  // Code-system identifier, as in HealthKind.
  string system = 3;
  // Kind's code, as in HealthKind.
  string code = 4;
  // Kind name from Ark terminology or a code-based fallback, as in HealthKind.
  string name = 5;
  // Distinct resource identities across all imports, at least one.
  uint64 count = 6;
  // Known times of these distinct entries, absent if unknown.
  HealthTimeSpan time_span = 7;
  // Sorted distinct protected categories, as in HealthKind.
  repeated HealthProtectedCategory protected_categories = 8;
}

// Unsupported resource counts at the approved level.
// Each count is at most 2 million. Unplaced is a subset of other, so hosts
// must not add it again when displaying the unsupported total.
message HealthUnsupportedCounts {
  // Attachment resources, 0 through 2 million.
  uint64 attachment = 1;
  // Other resources including unplaced entries, 0 through 2 million.
  uint64 other = 2;
  // Invalid entries, 0 through 2 million.
  uint64 invalid = 3;
  // Unplaced entries also included in other, 0 through other.
  uint64 unplaced = 4;
}

// Prompt request to delete one committed import.
// Requires unlocked storage. The 120s prompt names the import, its received
// date and how many kinds it touches. The response waits for approved deletion
// of the import, index and dependent cached views. Other imports remain intact.
// An absent import returns HEALTH_ERRORS_IMPORT_UNKNOWN without a prompt.
message HealthDeleteRequest {
  // Exactly 16 random bytes from an import response.
  bytes import_id = 1;
}

// Empty acknowledgement of approved deletion.
message HealthDeleteResponse {
}
